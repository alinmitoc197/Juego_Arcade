<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clash de Bandos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* Tema "Neón": cian / magenta / violeta sobre índigo. Todo se diseña en 1280x720 y se escala. */
:root {
  --bg: #05060f; --line: rgba(255, 255, 255, .14);
  --text: #eef2ff; --muted: #98a0c0;
  --accent: #ffd166; --accent2: #f59e0b; --hi: #ef4444; --violet: #3b82f6; --lime: #ffd166;
  --p1: #3b82f6; --p2: #ef4444;
  --glass: rgba(10, 12, 30, .78);
  --font-display: 'Chakra Petch', 'Orbitron', 'Segoe UI', sans-serif;
  --font-ui: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; font-family: var(--font-ui); font-size: 17px; color: var(--text); user-select: none; -webkit-user-select: none; }
button { font-family: inherit; }
#viewport { position: fixed; inset: 0; overflow: hidden; background: #000; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
#scene-root { position: absolute; inset: 0; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 100; }
#fade.on { opacity: 1; }
#fps { position: absolute; right: 10px; bottom: 6px; font: 600 14px var(--font-ui); color: #9f9; z-index: 101; pointer-events: none; }
.scene { position: absolute; inset: 0; overflow: hidden; }
.hidden { display: none !important; }

/* fondo "bando contra bando": azul a la izquierda, rojo a la derecha y un rayo de choque en el centro */
.bg-space {
  background:
    radial-gradient(720px 520px at 18% 22%, rgba(59, 130, 246, .42), transparent 65%),
    radial-gradient(720px 520px at 84% 80%, rgba(239, 68, 68, .42), transparent 65%),
    linear-gradient(105deg, #071433 0%, #0a1026 45%, #1a0a14 55%, #2a0b12 100%);
}
.bg-space::before { content: ''; position: absolute; left: 50%; top: -10%; width: 6px; height: 120%; background: linear-gradient(180deg, #fff, rgba(255, 255, 255, .1)); box-shadow: 0 0 34px 8px rgba(255, 255, 255, .3); transform: translateX(-50%) skewX(-14deg); opacity: .4; }
.bg-space::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .03) 0 2px, transparent 2px 14px); }
.scene > * { z-index: 1; }
.art-wrap { overflow: hidden; }
.art-wrap svg { width: 100%; height: 100%; display: block; }

.btn { padding: 13px 36px; background: linear-gradient(180deg, var(--accent), var(--accent2)); border: 0; border-radius: 999px; font: 700 20px var(--font-display); letter-spacing: .14em; color: #05060f; cursor: pointer; text-transform: uppercase; }
.btn:hover, .btn.is-focus { filter: brightness(1.12); box-shadow: 0 0 0 3px #fff, 0 0 28px var(--accent); }
.btn-ghost { padding: 11px 24px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 999px; color: #fff; font: 600 17px var(--font-ui); cursor: pointer; }
.btn-ghost:hover, .btn-ghost.is-focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.hint { color: var(--muted); font-size: 15px; letter-spacing: .03em; }
.foot-btns { display: flex; gap: 12px; align-items: center; }

.keycap { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 8px; font: 700 15px var(--font-ui); color: #fff; }
.keycap.big { min-width: 54px; height: 54px; font-size: 22px; border-radius: 12px; }
.keycap.arrow { color: var(--accent); border-color: rgba(255, 209, 102, .45); }
.keycap.face { background: rgba(59, 130, 246, .22); border-color: var(--violet); }

.overlay { position: absolute; inset: 0; background: rgba(3, 3, 14, .72); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 30; }
.panel { background: var(--glass); border: 1px solid var(--accent); box-shadow: 0 0 40px rgba(255, 209, 102, .25); border-radius: 22px; padding: 34px 46px; text-align: center; max-width: 620px; }
.panel h2 { font: 700 40px var(--font-display); letter-spacing: .1em; margin-bottom: 20px; color: var(--accent); text-transform: uppercase; }
.panel p { color: #c4c8da; line-height: 1.5; margin-bottom: 22px; }
.menu-list { display: flex; flex-direction: column; gap: 12px; min-width: 360px; }
.menu-btn { width: 100%; }

.topbar { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; padding: 0 28px; gap: 24px; z-index: 6; }
.topbar-title { font: 700 17px var(--font-display); letter-spacing: .3em; flex: 1; text-align: center; color: #cfd8ff; }
.topbar-mode { font: 700 15px var(--font-display); letter-spacing: .25em; color: var(--accent); text-transform: uppercase; min-width: 160px; text-align: right; }
.page-title { position: absolute; left: 60px; top: 84px; font: 700 48px var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.page-title.small { position: static; font-size: 40px; }
.select-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; background: linear-gradient(transparent, rgba(3, 3, 14, .8)); z-index: 6; }

/* ---------- MENÚ PRINCIPAL: columna izquierda (título de bandos) + mosaico con luchadores dentro ---------- */
.menu-left { position: absolute; left: 64px; top: 92px; width: 330px; }
.kicker { font: 600 14px var(--font-display); letter-spacing: .5em; color: var(--accent); }
.title { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; line-height: 1; }
.title-w { font-size: 43px; letter-spacing: .03em; }
.title-w.t1 { color: #8fbcff; text-shadow: 0 2px 0 #1d4ed8, 0 0 22px rgba(59, 130, 246, .85); }
.title-w.t2 { color: #ff9a9a; text-shadow: 0 2px 0 #b91c1c, 0 0 22px rgba(239, 68, 68, .85); }
.vs-badge { align-self: flex-start; background: #fff; color: #05060f; font: 700 17px var(--font-display); letter-spacing: .25em; padding: 3px 18px; border-radius: 999px; box-shadow: 0 0 16px rgba(255, 255, 255, .5); }
.title-rule { height: 3px; width: 150px; margin: 24px 0; background: linear-gradient(90deg, #3b82f6, #ef4444); border-radius: 2px; }
.menu-desc { border-left: 4px solid var(--accent); padding-left: 16px; font-size: 21px; line-height: 1.35; min-height: 92px; color: #e8ecff; }
.lang-box { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; margin-top: 20px; width: 200px; }
.lang-select { background: transparent; color: #fff; border: 0; font: 600 17px var(--font-ui); width: 100%; outline: none; }
.lang-select option { background: #10102a; }
.menu-left .hint { margin-top: 24px; }

.menu-grid { position: absolute; left: 430px; right: 56px; top: 78px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.tile { position: relative; border: 2px solid rgba(255, 255, 255, .16); background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)), #0a0d22; border-radius: 18px; color: #fff; cursor: pointer; overflow: hidden; text-align: left; transition: transform .16s, box-shadow .16s, border-color .16s; --c: #8f98c0; }
.tile.r1 { height: 170px; grid-column: span 3; --ah: 430px; --at: -14px; --ih: 272px; --it: -22px; }
.tile.r2 { height: 142px; grid-column: span 2; --ah: 350px; --at: -8px; }
.tile.r3 { height: 130px; grid-column: span 3; --ah: 330px; --at: -6px; }
.tile.r4 { height: 70px; grid-column: span 2; border-radius: 999px; }
.tile::before { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 34%, var(--c) 120%); opacity: .42; }
.tile-in { position: absolute; inset: 0; }
.tile-art { position: absolute; top: var(--at); height: var(--ah); aspect-ratio: 240 / 360; width: auto; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .55)); transition: transform .2s; }
.tile-art.a0 { right: 5%; } .tile-art.a1 { right: 34%; transform: scaleX(-1); }
.tile-art.solo { right: 8%; }
/* imágenes reales: fondo con el color del contorno del personaje + resplandor del mismo color */
.tile-img { position: absolute; top: var(--it, -16px); height: var(--ih, 260px); width: auto; right: 4%; pointer-events: none; filter: drop-shadow(0 0 10px var(--c)) drop-shadow(0 8px 12px rgba(0, 0, 0, .55)); transition: transform .2s; }
.tile-img.a1 { right: 34%; transform: scaleX(-1); }
.tile.img::before { background: radial-gradient(300px 230px at 80% 38%, var(--c), transparent 72%), linear-gradient(110deg, #0a0d22 16%, var(--cd) 100%); opacity: 1; }
.tile.img { border-color: var(--c); }
.tile.is-focus .tile-img { transform: scale(1.04); } .tile.is-focus .tile-img.a1 { transform: scaleX(-1.04) scaleY(1.04); }
.tile.r4 .tile-art { display: none; }
.tile::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, rgba(3, 4, 14, .88)); pointer-events: none; }
.tile.r4::after { display: none; }
.badge { position: absolute; top: 14px; left: 18px; z-index: 3; border: 1px solid #fff; color: #05060f; background: #fff; font: 700 12px var(--font-display); letter-spacing: .14em; padding: 1px 12px; border-radius: 999px; }
.tile-label { position: absolute; left: 18px; bottom: 12px; z-index: 3; max-width: 60%; font: 700 28px var(--font-display); letter-spacing: .05em; text-transform: uppercase; line-height: .98; text-shadow: 0 2px 10px #000; }
.tile.r2 .tile-label { font-size: 22px; } .tile.r3 .tile-label { font-size: 26px; }
.tile.r4 .tile-in { display: flex; align-items: center; justify-content: center; gap: 12px; }
.tile.r4 .tile-label { position: static; font-size: 19px; max-width: none; text-shadow: none; }
.tile-icon { font-size: 24px; color: var(--accent); }
.soon { position: absolute; top: 14px; right: 16px; z-index: 3; font: 700 11px var(--font-display); letter-spacing: .25em; color: var(--accent); background: rgba(0, 0, 0, .55); padding: 2px 10px; border-radius: 999px; }
.tile[data-disabled="true"] { filter: saturate(.35) brightness(.8); }
.tile.is-focus { border-color: #fff; box-shadow: 0 0 0 3px #fff, 0 0 40px var(--c); transform: scale(1.035); z-index: 4; filter: none; }
.tile.is-focus .tile-art { transform: scale(1.05); } .tile.is-focus .tile-art.a1 { transform: scaleX(-1.05) scaleY(1.05); }
.credits-panel { max-width: 560px; }
.version { position: absolute; left: 16px; bottom: 10px; font: 600 13px var(--font-display); letter-spacing: .15em; color: rgba(255, 255, 255, .45); }

/* ---------- SELECCIÓN DE LUCHADOR ---------- */
.hero { position: absolute; left: 0; right: 0; top: 0; height: 262px; overflow: hidden; background: linear-gradient(180deg, rgba(3, 3, 14, .1), rgba(3, 3, 14, .8)); border-bottom: 1px solid var(--line); }
.hero-art { position: absolute; bottom: -100px; width: 240px; height: 360px; }
.hero-art.left { left: 120px; } .hero-art.right { right: 120px; transform: scaleX(-1); }
.hero-ghost { position: absolute; inset: 0; display: grid; place-items: center; font: 700 170px var(--font-display); letter-spacing: .04em; color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .09); text-transform: uppercase; white-space: nowrap; }
.vs-logo { position: absolute; left: 50%; top: 88px; transform: translateX(-50%); font: 700 64px var(--font-display); letter-spacing: .1em; color: #fff; text-shadow: 0 0 24px var(--hi), 0 0 8px var(--accent); }
.pbars { position: absolute; left: 40px; right: 40px; top: 246px; height: 100px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.pbar { padding: 12px 24px; opacity: .7; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(4px); }
.pbar.active { opacity: 1; }
.pbar.p1 { border-left: 5px solid var(--p1); } .pbar.active.p1 { box-shadow: 0 0 26px rgba(59, 130, 246, .35); }
.pbar.p2 { border-right: 5px solid var(--p2); text-align: right; } .pbar.active.p2 { box-shadow: 0 0 26px rgba(239, 68, 68, .35); }
.pbar .ptag { display: inline-block; font: 700 12px var(--font-display); letter-spacing: .25em; padding: 2px 14px; border-radius: 999px; color: #05060f; }
.pbar.p1 .ptag { background: var(--p1); } .pbar.p2 .ptag { background: var(--p2); }
.pbar .pname { font: 700 38px var(--font-display); letter-spacing: .06em; line-height: 1.05; margin-top: 4px; }
.pbar .pname.dim { color: #4a4d6a; }
.pgroup { font: 600 13px var(--font-display); letter-spacing: .3em; color: var(--muted); }
.prompt { position: absolute; left: 60px; top: 366px; display: flex; gap: 20px; align-items: center; }
.prompt-mode { font: 700 12px var(--font-display); letter-spacing: .25em; color: #05060f; background: var(--accent); padding: 3px 14px; border-radius: 999px; }
.prompt-title { font: 700 22px var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
.groups { position: absolute; left: 40px; right: 40px; top: 420px; display: flex; gap: 28px; justify-content: center; }
.group { width: 384px; padding: 12px 14px 14px; background: var(--glass); border: 1px solid color-mix(in srgb, var(--gc) 45%, transparent); border-radius: 18px; }
.group-title { display: flex; align-items: center; gap: 10px; font: 700 14px var(--font-display); letter-spacing: .3em; color: var(--gc); margin-bottom: 10px; }
.group-title em { font-style: normal; color: #8a90b0; font-size: 13px; letter-spacing: 0; }
.group-title i { flex: 1; height: 1px; background: linear-gradient(90deg, var(--gc), transparent); }
.slot-grid { display: grid; grid-template-columns: repeat(6, 54px); gap: 6px; }
.slot-grid.c3 { grid-template-columns: repeat(4, 48px); }
.slot { width: 54px; height: 54px; border: 2px solid rgba(255, 255, 255, .12); background: #0d0d26; border-radius: 14px; overflow: hidden; padding: 0; cursor: pointer; position: relative; transition: transform .1s; }
.slot .art-wrap { width: 100%; height: 100%; transform: scale(1.2); }
.slot.small { width: 48px; height: 48px; }
.slot.is-focus { border-color: #fff; box-shadow: 0 0 0 2px var(--hi), 0 0 18px var(--hi); z-index: 2; transform: scale(1.14); }
.slot-tip { position: absolute; transform: translateX(-50%); background: #0f0f2e; border: 1px solid var(--accent); padding: 4px 14px; border-radius: 999px; font: 600 14px var(--font-display); letter-spacing: .1em; z-index: 10; pointer-events: none; white-space: nowrap; }

/* ---------- PRESENTACIÓN VS: mitades enfrentadas + anillo central ---------- */
.scene-vs { background: #000; }
.vs-half { position: absolute; inset: 0; overflow: hidden; }
.vs-half.left { clip-path: polygon(0 0, 46% 0, 54% 100%, 0 100%); background: linear-gradient(160deg, #1d4ed8, #0a1230); animation: slideL .45s ease-out both; }
.vs-half.right { clip-path: polygon(46% 0, 100% 0, 100% 100%, 54% 100%); background: linear-gradient(200deg, #b91c1c, #200a12); animation: slideR .45s ease-out both; }
.vs-half::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 2px, transparent 2px 5px); }
.vs-art { position: absolute; bottom: -120px; height: 112%; width: 560px; z-index: 1; }
.vs-half.left .vs-art { left: 70px; } .vs-half.right .vs-art { right: 70px; transform: scaleX(-1); }
.vs-diag { position: absolute; left: 50%; top: -10px; width: 6px; height: 740px; background: linear-gradient(180deg, var(--accent), var(--hi)); box-shadow: 0 0 24px var(--accent), 0 0 24px var(--hi); transform: translateX(-50%) skewX(6.2deg); z-index: 2; }
.vs-ring { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; transform: translate(-50%, -56%); z-index: 3; display: grid; place-items: center; font: 700 88px var(--font-display); letter-spacing: .04em; color: #fff; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle, #1c0f44, #070716); box-shadow: 0 0 0 10px rgba(255, 255, 255, .08), 0 0 70px rgba(59, 130, 246, .85); animation: popRing .5s cubic-bezier(.2, 1.5, .4, 1) .25s both; text-shadow: 0 0 20px var(--hi); }
.vs-ring::before { content: ''; position: absolute; inset: -24px; border-radius: 50%; border: 3px dashed var(--accent); animation: spin 12s linear infinite; }
.vs-plate { position: absolute; bottom: 124px; background: rgba(5, 5, 20, .78); backdrop-filter: blur(6px); padding: 8px 40px; font: 700 58px var(--font-display); letter-spacing: .08em; text-transform: uppercase; z-index: 4; }
.vs-plate.left { left: 40px; border-left: 8px solid var(--accent); } .vs-plate.right { right: 40px; border-right: 8px solid var(--hi); text-align: right; }
.vs-group { position: absolute; top: -26px; left: 0; background: transparent; color: var(--accent); font: 600 14px var(--font-display); letter-spacing: .35em; }
.vs-plate.right .vs-group { left: auto; right: 0; color: var(--hi); }
.vs-center { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); text-align: center; width: 520px; z-index: 5; }
.vs-label { display: inline-block; background: rgba(5, 5, 20, .85); color: #fff; border: 1px solid var(--accent); font: 700 20px var(--font-display); letter-spacing: .2em; padding: 6px 34px; border-radius: 999px; margin-bottom: 10px; text-transform: uppercase; }
.vs-space { font: 600 13px var(--font-display); letter-spacing: .4em; color: var(--muted); }
.vs-progress { height: 4px; background: rgba(255, 255, 255, .15); margin: 8px 0; border-radius: 2px; overflow: hidden; }
.vs-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--hi)); width: 0; }
.vs-loading { font: 600 12px var(--font-display); letter-spacing: .4em; color: #8a90b0; }
.vs-close { position: absolute; top: 20px; right: 24px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; border: 1px solid var(--line); cursor: pointer; z-index: 6; }
@keyframes slideL { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes slideR { from { transform: translateX(100%); } to { transform: none; } }
@keyframes popRing { from { transform: translate(-50%, -56%) scale(0); } to { transform: translate(-50%, -56%) scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- OPCIONES: pestañas arriba, panel ancho ---------- */
.opt-tabs { position: absolute; left: 60px; top: 150px; display: flex; gap: 12px; }
.opt-tabs.row { position: static; }
.opt-tab { padding: 12px 26px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 999px; color: #b4bbdc; font: 700 16px var(--font-display); letter-spacing: .14em; display: flex; gap: 12px; align-items: center; cursor: pointer; text-transform: uppercase; }
.opt-tab.on { background: var(--accent); border-color: var(--accent); color: #05060f; box-shadow: 0 0 22px rgba(255, 209, 102, .45); }
.opt-tab .num { opacity: .6; font-size: 13px; }
.opt-panel { position: absolute; left: 60px; right: 60px; top: 212px; bottom: 96px; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 12px; overflow: auto; }
.opt-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 26px; border-radius: 14px; border: 1px solid transparent; gap: 30px; }
.opt-row.is-focus { border-color: var(--accent); background: rgba(255, 209, 102, .07); }
.opt-name { font: 700 22px var(--font-ui); letter-spacing: .02em; } .opt-desc { color: var(--muted); font-size: 16px; margin-top: 2px; max-width: 520px; }
.stepper { display: flex; gap: 10px; align-items: center; }
.stepper button { width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); color: #fff; font-size: 22px; cursor: pointer; }
.stepper button:hover { border-color: var(--accent); }
.stepper-val { min-width: 220px; text-align: center; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 999px; padding: 11px; font: 700 19px var(--font-display); letter-spacing: .06em; }
.opt-row.is-focus .stepper-val { border-color: var(--accent); color: var(--accent); }
.opt-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; }

/* ---------- AYUDA ---------- */
.help-head { position: absolute; left: 60px; right: 60px; top: 76px; display: flex; align-items: center; gap: 28px; }
.seg { margin-left: auto; display: flex; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.seg button { padding: 9px 22px; border: 0; background: transparent; color: #b4bbdc; border-radius: 999px; font: 700 15px var(--font-display); letter-spacing: .1em; cursor: pointer; }
.seg .on { background: var(--hi); color: #fff; }
.help-body { position: absolute; left: 60px; right: 60px; top: 156px; bottom: 96px; display: grid; gap: 20px; }
.help-body.two { grid-template-columns: 420px 1fr; } .help-body.moves-layout { grid-template-columns: 300px 1fr; }
.help-card, .help-slots { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 22px; overflow: auto; }
.help-card h3 { font: 700 14px var(--font-display); letter-spacing: .3em; color: var(--accent); margin-bottom: 16px; }
.help-card p { color: #b8bdd8; font-size: 16px; line-height: 1.45; margin-bottom: 10px; }
.dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; margin: 10px 0 20px; text-align: center; }
.dpad .u { grid-column: 2; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; }

.side.p1 .pname { left: 96px; } .side.p2 .pname { right: 96px; flex-direction: row-reverse; }

.bar { position: absolute; top: 34px; height: 26px; border-radius: 13px; background: rgba(0, 0, 0, .65); border: 2px solid rgba(255, 255, 255, .75); overflow: hidden; }

.bar-in { position: relative; height: 100%; }

.p1 .fill, .p1 .trail { left: 0; } .p2 .fill, .p2 .trail { right: 0; }
.p1 .fill { background: linear-gradient(90deg, #1d4ed8, #60a5fa); }
.p2 .fill { background: linear-gradient(270deg, #b91c1c, #f87171); }

.sup-seg i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f59e0b, #ffe08a); }
.p2 .sup-seg i { margin-left: auto; }
.side.ready .sup-seg { border-color: #ffe08a; box-shadow: 0 0 10px rgba(245, 158, 11, .8); }

.hud-center { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 140px; text-align: center; }
.hud-timer { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto; border: 4px solid #fff; background: radial-gradient(circle, #1c0f44, #070716); box-shadow: 0 0 0 6px rgba(255, 255, 255, .1), 0 0 30px rgba(59, 130, 246, .75); display: grid; place-items: center; }
.hud-time { font: 700 44px var(--font-display); text-shadow: 0 0 14px var(--hi); }

.pips.p1 i.won { background: var(--p1); border-color: #fff; box-shadow: 0 0 10px var(--p1); }
.pips.p2 i.won { background: var(--hi); border-color: #fff; box-shadow: 0 0 10px var(--hi); }

.combo { position: absolute; top: 190px; opacity: 0; transition: opacity .15s; text-transform: uppercase; text-shadow: 0 0 14px rgba(0, 0, 0, .8); }

.training-tag { position: absolute; bottom: 12px; left: 16px; color: #cde; font: 600 14px var(--font-ui); background: rgba(0, 0, 0, .55); padding: 4px 12px; border-radius: 999px; z-index: 6; }
.pause-panel { min-width: 440px; }
@keyframes bannerIn { from { transform: translateX(-140px); letter-spacing: .5em; opacity: 0; } to { transform: none; opacity: 1; } }

  GROUPS.forEach((g, gi) => {
    NAMES[g.id].forEach((name, i) => {
      const idx = gi * 12 + i;
      const arch = ARCH_KEYS[(idx * 7 + gi) % ARCH_KEYS.length];
      const a = ARCHETYPES[arch];
      const specials = [...a.specials].sort((x, y) => SPECIAL_PRIORITY.indexOf(x) - SPECIAL_PRIORITY.indexOf(y));
      ROSTER.push({
        id: name.toLowerCase(),
        name: name.toUpperCase(),
        group: g.id,
        idx,
        archetype: arch,
        hue: (idx * 29 + gi * 40) % 360,
        skin: SKINS[idx % SKINS.length],
        hair: idx * 53 % 360,
        hairStyle: idx % 4,
        stats: { vitality: a.vitality, power: a.power, speed: a.speed },
        specials,
        specialMoves: specials.map((s) => SPECIALS[s])
      });
    });
  });
  var getFighter = (id) => ROSTER.find((f) => f.id === id) || ROSTER[0];
  function randomFighter(excludeId = null) {
    const pool = ROSTER.filter((f) => f.id !== excludeId);
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function palette(def, variant = 0) {
    const h2 = (def.hue + variant * 70) % 360;
    return {
      primary: `hsl(${h2} 62% 46%)`,
      primaryLight: `hsl(${h2} 70% 58%)`,
      primaryDark: `hsl(${h2} 60% 26%)`,
      secondary: `hsl(${(h2 + 200) % 360} 45% 30%)`,
      accent: `hsl(${(h2 + 45) % 360} 90% 58%)`,
      skin: def.skin,
      hair: `hsl(${def.hair} 55% 30%)`
    };
  }
  function getMoveList(def) {
    return def.specials.map((id) => ({ id, motion: SPECIALS[id].motions[0], input: SPECIALS[id].input, cost: SPECIALS[id].cost || 0 }));
  }

  var MenuScene = class extends Scene {
    mount(container, params = {}) {
      const f = params.focus;
      this.focusIndex = typeof f === "string" ? Math.max(0, TILES.findIndex((x) => x.id === f)) : f ?? 1;
      this.el = h("div", { class: "scene scene-menu bg-space" });
      container.append(this.el);
      this.render();
      this.off = I18n.onChange(() => this.render());
    }
    unmount() {
      this.off?.();
      super.unmount();
    }
    render() {
      const el = this.el;
      el.innerHTML = "";
      const desc = h("div", { class: "menu-desc" });
      const tiles = TILES.map((tl) => {
        const solo = (n) => n === 1 ? " solo" : "";
        const placeholders = () => (tl.art || []).map((i, k) => artEl(ROSTER[i], 0, "full", `tile-art a${k}${solo(tl.art.length)}`));
        const art = tl.imgs ? tl.imgs.map((src, k) => h("img", {
          class: `tile-img a${k}${solo(tl.imgs.length)}`,
          src,
          alt: "",
          draggable: "false",
          onError: (e) => {
            const back = placeholders();
            if (k === 0) e.target.replaceWith(...back);
            else e.target.remove();
          }
        })) : placeholders();
        return h(
          "button",
          { class: `tile ${tl.row}${tl.imgs ? " img" : ""}`, style: { "--c": tl.c || "#8f98c0", "--cd": tl.cd || "#1a1d3a" }, dataset: { id: tl.id, disabled: tl.off ? "true" : "false" } },
          h(
            "div",
            { class: "tile-in" },
            art,
            tl.badge ? h("span", { class: "badge" }, tl.badge) : null,
            tl.icon ? h("span", { class: "tile-icon" }, tl.icon) : null,
            h("span", { class: "tile-label" }, t(`menu.${tl.id}`)),
            tl.off ? h("span", { class: "soon" }, t("common.soon")) : null
          )
        );
      });
      const langSel = h(
        "select",
        { class: "lang-select", onChange: (e) => {
          Settings.set("language", e.target.value);
          I18n.setLang(e.target.value);
        } },
        h("option", { value: "es", selected: I18n.lang === "es" }, "Espa\xF1ol"),
        h("option", { value: "en", selected: I18n.lang === "en" }, "English")
      );
      langSel.addEventListener("keydown", (e) => e.stopPropagation());
      el.append(
        h(
          "div",
          { class: "menu-left" },
          h("div", { class: "kicker" }, t("menu.kicker")),
          h(
            "div",
            { class: "title" },
            h("span", { class: "title-w t1" }, GAME.title[0]),
            h("span", { class: "vs-badge" }, "VS"),
            h("span", { class: "title-w t2" }, GAME.title[1])
          ),
          h("div", { class: "title-rule" }),
          desc,
          h("div", { class: "lang-box" }, h("span", { class: "globe" }, "\u{1F310}"), langSel),
          h("div", { class: "hint" }, t("menu.hint"))
        ),
        h("div", { class: "menu-grid" }, tiles),
        h("div", { class: "version" }, `v${GAME.version}`),
        this.credits = h(
          "div",
          { class: "overlay hidden", onClick: () => this.toggleCredits(false) },
          h("div", { class: "panel credits-panel" }, h("h2", {}, t("menu.credits")), h("p", {}, t("menu.creditsText")), h("div", { class: "btn" }, t("common.close")))
        )
      );
      this.focus = new FocusGroup(tiles, {
        initial: this.focusIndex,
        onFocus: (btn) => {
          this.focusIndex = tiles.indexOf(btn);
          desc.textContent = t(`menu.desc.${btn.dataset.id}`);
        },
        onActivate: (btn) => this.activate(btn.dataset.id)
      });
    }
    toggleCredits(on) {
      this.credits.classList.toggle("hidden", !on);
      this.creditsOpen = on;
    }
    activate(id) {
      const idx = this.focusIndex;
      switch (id) {
        case "arcade":
          this.ctx.go("select", { mode: "arcade" });
          break;
        case "versus":
          this.ctx.go("select", { mode: "versus" });
          break;
        case "training":
          this.ctx.go("select", { mode: "training" });
          break;
        case "spectator":
          this.ctx.go("versusIntro", { mode: "spectator", p1: { id: null }, p2: { id: null } });
          break;
        case "options":
          this.ctx.go("options", { from: idx });
          break;
        case "help":
          this.ctx.go("help", { from: idx });
          break;
        case "credits":
          this.toggleCredits(true);
          break;
        default:
          break;
      }
    }
    onKey(code) {
      if (this.creditsOpen) {
        if (code === "Escape" || code === "Enter" || code === "Space") {
          Sfx.play("back");
          this.toggleCredits(false);
        }
        return;
      }
      this.focus.handleKey(code);
    }
  };

  var shuffle = (a) => {
    const r = [...a];
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;

      if (dist > 260) {

        if (has("dashKick") && r < 0.35 + 0.15 * L) return { type: "macro", frames: [{ d: 1 }, { d: 1, b: 1 }, { b: 1, p: kick }], t: t2 };

      if (r < 0.74 && L < 0.5) return { type: "taunt", t: 20 };

    }
  };

        spectator: [new AIController(Settings.get("cpuDifficulty")), new AIController(Settings.get("cpuDifficulty"))]
      }[this.mode];
      this.engine = new FightEngine({
        defs: [d1, d2],
        variants: [p.p1.variant || 0, p.p2.variant || 0],
        controllers,
        mode: this.mode,
        settings: { roundTime: Settings.get("roundTime"), roundsToWin: Settings.get("roundsToWin") },
        emit: (n, d) => this.onEvent(n, d)
      });
      this.hud = new HUD(this.engine);
      this.canvas = h("canvas", { width: WORLD.width, height: WORLD.height });
      this.renderer = new Renderer(this.canvas, STAGES[Math.floor(Math.random() * STAGES.length)]);
      this.world = h("div", { class: "world" }, this.canvas);
      this.overlay = h("div", { class: "overlay hidden" });
      this.el = h(
        "div",
        { class: "scene scene-fight" },
        this.world,
        this.hud.el,
        this.overlay,
        this.mode === "training" ? h("div", { class: "training-tag" }, `${t("mode.training")} \xB7 Esc`) : null
      );
      container.append(this.el);
      this.acc = 0;
      this.shake = 0;
      this.paused = false;
      this.ended = false;
      if (this.mode === "training") this.hud.showBanner(t("mode.training"), "round", 900);
    }
    onEvent(name, d) {
      if (name === "banner") this.hud?.showBanner(t(d.key, d.params), d.kind, d.kind === "ko" ? 1800 : 1400);
      else if (name === "sfx") Sfx.play(d);
      else if (name === "shake") {
        if (Settings.get("screenShake")) this.shake = Math.max(this.shake, d);
      } else if (name === "matchEnd") this.matchEnd(d.winner);
    }
    // ---------- final de combate
    matchEnd(winner) {
      if (this.ended) return;
      this.ended = true;
      const p = this.params;
      const go = (name, extra) => () => this.ctx.go(name, extra);
      const same = { ...p };
      let title, buttons;
      if (this.mode === "arcade") {
        const last2 = (p.index ?? 0) + 1 >= p.ladder.length;
        if (winner === 0 && !last2) {
          const next = (p.index ?? 0) + 1;
          title = t("result.win");
          buttons = [[t("result.next"), go("versusIntro", { ...p, index: next, p2: { id: p.ladder[next], variant: p.ladder[next] === p.p1.id ? 1 : 0 } })], [t("result.toMenu"), go("menu", { focus: "arcade" })]];
        } else if (winner === 0) {
          title = t("result.complete");
          buttons = [[t("result.toMenu"), go("menu", { focus: "arcade" })]];
        } else {
          title = t("result.lose");
          buttons = [[t("result.retry"), go("versusIntro", same)], [t("result.toMenu"), go("menu", { focus: "arcade" })]];
        }
      } else if (this.mode === "versus") {
        title = winner < 0 ? t("result.draw") : t(winner === 0 ? "result.p1" : "result.p2");
        buttons = [[t("result.rematch"), go("versusIntro", same)], [t("result.toSelect"), go("select", { mode: "versus" })], [t("result.toMenu"), go("menu", { focus: "versus" })]];
      } else {
        title = winner < 0 ? t("result.draw") : this.engine.fighters[winner].def.name;
        buttons = [[t("result.again"), go("versusIntro", { mode: "spectator", p1: { id: null }, p2: { id: null } })], [t("result.toMenu"), go("menu", { focus: "spectator" })]];
      }
      setTimeout(() => this.openOverlay(title, buttons), 600);
    }
    openOverlay(title, buttons) {
      const btns = buttons.map(([label, fn]) => h("button", { class: "btn menu-btn", onClick: () => {
      } }, label));
      this.overlay.innerHTML = "";
      this.overlay.append(h("div", { class: "panel pause-panel" }, h("h2", {}, title), h("div", { class: "menu-list" }, btns)));
      this.overlay.classList.remove("hidden");
      this.overlayFocus = new FocusGroup(btns, { onActivate: (_, i) => buttons[i][1]() });
    }
    togglePause() {
      if (this.ended) return;
      this.paused = !this.paused;
      if (!this.paused) {
        this.overlay.classList.add("hidden");
        this.overlayFocus = null;
        return;
      }
      const p = this.params;
      this.openOverlay(t("pause.title"), [
        [t("pause.resume"), () => this.togglePause()],
        [t("pause.restart"), () => this.ctx.go("versusIntro", { ...p })],
        ...this.mode === "spectator" ? [] : [[t("pause.select"), () => this.ctx.go("select", { mode: this.mode })]],
        [t("pause.menu"), () => this.ctx.go("menu", { focus: this.mode })]
      ]);
    }
    update(dt) {
      const e = this.engine;
      const fps = document.getElementById("fps");
      if (fps) {
        this.fpsT = (this.fpsT || 0) + dt;
        this.fpsN = (this.fpsN || 0) + 1;
        if (this.fpsT >= 0.5) {
          fps.textContent = Settings.get("showFps") ? `${Math.round(this.fpsN / this.fpsT)} FPS` : "";
          this.fpsT = 0;
          this.fpsN = 0;
        }
      }
      if (!this.paused) {
        this.acc += Math.min(dt, 0.1) * e.timeScale;
        let n = 0;
        while (this.acc >= STEP && n < 5) {
          e.step();
          Input.endStep();
          this.acc -= STEP;
          n++;
        }
      } else Input.endStep();
      this.renderer.draw(e, { showBoxes: Settings.get("showHitboxes") });
      this.hud.update();
      this.shake *= 0.86;
      this.world.style.transform = this.shake > 0.3 ? `translate(${(Math.random() - 0.5) * this.shake * 1.6}px, ${(Math.random() - 0.5) * this.shake}px)` : "";
    }
    unmount() {
      const fps = document.getElementById("fps");
      if (fps) fps.textContent = "";
      super.unmount();
    }
    onKey(code) {
      if (code === "Escape") return this.paused || !this.ended ? this.togglePause() : void 0;
      if (this.overlayFocus) this.overlayFocus.handleKey(code);
    }
  };

  // js/scenes/OptionsScene.js
  var onoff = (v) => t(v ? "option.on" : "option.off");
  var nums = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  var SCHEMA = [
    { tab: "game", key: "cpuDifficulty", values: nums(1, 8), fmt: (v) => `${v} \xB7 ${t(`difficulty.${v}`)}` },
    { tab: "game", key: "roundTime", values: [30, 60, 99, 0], fmt: (v) => v === 0 ? t("option.unlimited") : t("option.seconds", { n: v }) },
    { tab: "game", key: "roundsToWin", values: [1, 2, 3], fmt: (v) => t("option.firstTo", { n: v }) },
    { tab: "game", key: "arcadeFights", values: [3, 6, 9, 12], fmt: (v) => String(v) },
    { tab: "screen", key: "sfxVolume", values: nums(0, 10), fmt: (v) => v === 0 ? t("option.off") : `${v * 10}%` },
    { tab: "screen", key: "screenShake", values: [true, false], fmt: onoff },
    { tab: "screen", key: "showFps", values: [true, false], fmt: onoff },
    { tab: "screen", key: "showHitboxes", values: [true, false], fmt: onoff },
    { tab: "language", key: "language", values: ["es", "en"], fmt: (v) => v === "es" ? "Espa\xF1ol" : "English" }
  ];
  var TABS = ["game", "screen", "language"];
  var OptionsScene = class extends Scene {
    mount(container, params = {}) {
      this.from = params.from ?? 0;
      this.tab = 0;
      this.row = 0;
      this.el = h("div", { class: "scene scene-options bg-space" });
      container.append(this.el);
      this.render();
      this.off = I18n.onChange(() => this.render());
    }
    unmount() {
      this.off?.();
      super.unmount();
    }
    rows() {
      return SCHEMA.filter((s) => s.tab === TABS[this.tab]);
    }
    render() {
      const rows = this.rows();
      const n = rows.length;
      if (this.row > n + 1) this.row = 0;
      this.el.innerHTML = "";
      this.el.append(
        h(
          "div",
          { class: "topbar" },
          h("button", { class: "btn-ghost back", onClick: () => this.back() }, `\u2039 ${t("common.back")}`),
          h("div", { class: "topbar-title" }, GAME.name),
          h("div", { class: "topbar-mode" }, t("options.title"))
        ),
        h("h1", { class: "page-title" }, t("options.title")),
        h("div", { class: "opt-tabs" }, TABS.map((k, i) => h(
          "button",
          { class: `opt-tab${i === this.tab ? " on" : ""}`, onClick: () => {
            this.tab = i;
            this.row = 0;
            Sfx.play("move");
            this.render();
          } },
          h("span", { class: "num" }, `0${i + 1}`),
          h("span", {}, t(`options.tab.${k}`))
        ))),
        h("div", { class: "opt-panel" }, rows.map((s, i) => {
          const val = Settings.get(s.key);
          const step = (d) => this.change(s, d);
          return h(
            "div",
            { class: `opt-row${this.row === i ? " is-focus" : ""}`, onMouseenter: () => {
              if (this.row !== i) {
                this.row = i;
                this.render();
              }
            } },
            h("div", { class: "opt-info" }, h("div", { class: "opt-name" }, t(`option.${s.key}`)), h("div", { class: "opt-desc" }, t(`option.${s.key}.desc`))),
            h("div", { class: "stepper" }, h("button", { onClick: () => step(-1) }, "\u2039"), h("div", { class: "stepper-val" }, s.fmt(val)), h("button", { onClick: () => step(1) }, "\u203A"))
          );
        })),
        h(
          "div",
          { class: "opt-foot" },
          h("div", { class: "hint" }, t("options.hint")),
          h(
            "div",
            { class: "foot-btns" },
            h("button", { class: `btn-ghost${this.row === n ? " is-focus" : ""}`, onClick: () => {
              Settings.reset();
              I18n.setLang(Settings.get("language"));
              Sfx.play("confirm");
              this.render();
            } }, t("common.reset")),
            h("button", { class: `btn${this.row === n + 1 ? " is-focus" : ""}`, onClick: () => this.back() }, t("common.back.upper"))
          )
        )
      );
    }
    change(s, d) {
      const i = s.values.indexOf(Settings.get(s.key));
      const next = s.values[(i + d + s.values.length) % s.values.length];
      Settings.set(s.key, next);
      if (s.key === "language") I18n.setLang(next);
      Sfx.play("move");
      this.render();
    }
    back() {
      Sfx.play("back");
      this.ctx.go("menu", { focus: this.from });
    }
    onKey(code, e) {
      const n = this.rows().length;
      if (code === "Escape") return this.back();
      if (code === "Tab") {
        this.tab = (this.tab + (e.shiftKey ? 2 : 1)) % TABS.length;
        this.row = 0;
        Sfx.play("move");
        return this.render();
      }
      if (code === "ArrowDown") {
        this.row = Math.min(n + 1, this.row + 1);
        Sfx.play("move");
        return this.render();
      }
      if (code === "ArrowUp") {
        this.row = Math.max(0, this.row - 1);
        Sfx.play("move");
        return this.render();
      }
      if (code === "ArrowLeft" || code === "ArrowRight") {
        const d = code === "ArrowLeft" ? -1 : 1;
        if (this.row < n) return this.change(this.rows()[this.row], d);
        this.row = this.row === n ? n + 1 : n;
        return this.render();
      }
      if (code === "Enter") {
        if (this.row === n) {
          Settings.reset();
          I18n.setLang(Settings.get("language"));
          Sfx.play("confirm");
          this.render();
        } else if (this.row === n + 1) this.back();
        else this.change(this.rows()[this.row], 1);
      }
    }
  };

  // js/scenes/HelpScene.js
  var TABS2 = ["fight", "moves", "keys"];
  var ARROW = { 2: "\u2193", 3: "\u2198", 6: "\u2192", 4: "\u2190", 1: "\u2199", 8: "\u2191", 9: "\u2197", 7: "\u2196" };
  var key = (label, cls = "") => h("span", { class: `keycap ${cls}` }, label);
  var HelpScene = class extends Scene {
    mount(container, params = {}) {
      this.from = params.from ?? 0;
      this.tab = 0;
      this.player = 0;
      this.fighter = 0;
      this.el = h("div", { class: "scene scene-help bg-space" });
      container.append(this.el);
      this.render();
      this.off = I18n.onChange(() => this.render());
    }
    unmount() {
      this.off?.();
      super.unmount();
    }
    get keys() {
      return CONTROLS[this.player];
    }
    render() {
      this.el.innerHTML = "";
      this.el.append(
        h(
          "div",
          { class: "topbar" },
          h("button", { class: "btn-ghost back", onClick: () => this.back() }, `\u2039 ${t("common.back")}`),
          h("div", { class: "topbar-title" }, GAME.name),
          h("div", { class: "topbar-mode" }, t("menu.help"))
        ),
        h(
          "div",
          { class: "help-head" },
          h("h1", { class: "page-title small" }, t("help.title")),
          h("div", { class: "opt-tabs row" }, TABS2.map((k, i) => h("button", { class: `opt-tab${i === this.tab ? " on" : ""}`, onClick: () => {
            this.tab = i;
            Sfx.play("move");
            this.render();
          } }, t(`help.tab.${k}`)))),
          h("div", { class: "seg" }, [0, 1].map((p) => h("button", { class: this.player === p ? "on" : "", onClick: () => {
            this.player = p;
            this.render();
          } }, t(`help.p${p + 1}`))))
        ),
        this[`tab_${TABS2[this.tab]}`](),
        h(
          "div",
          { class: "select-foot" },
          h("div", { class: "hint" }, t(this.tab === 1 ? "help.hintMoves" : "help.hintFight")),
          h("div", { class: "foot-btns" }, h("button", { class: "btn", onClick: () => this.back() }, t("common.back.upper")))
        )
      );
    }
    tab_fight() {
      const k = this.keys;
      const dirKey = (code, label) => h("div", { class: "dirkey" }, key(keyLabel(code), "big"), h("small", {}, label));
      const atk = (b) => h("div", { class: "atk" }, key(keyLabel(k[b]), "big"), h("div", {}, h("b", {}, t(`btn.${b}`)), h("span", {}, t(`btn.${b}.desc`))));
      return h(
        "div",
        { class: "help-body two" },
        h(
          "div",
          { class: "help-card" },
          h("h3", {}, t("help.movement")),
          h(
            "div",
            { class: "dpad" },
            h("div", { class: "u" }, dirKey(k.up, t("help.jump"))),
            h("div", { class: "l" }, dirKey(k.left, t("help.back"))),
            h("div", { class: "r" }, dirKey(k.right, t("help.forward"))),
            h("div", { class: "d" }, dirKey(k.down, t("help.crouch")))
          ),
          h("p", {}, t("help.block1")),
          h("p", {}, t("help.block2"))
        ),
        h(
          "div",
          { class: "help-card" },
          h("h3", {}, t("help.attacks")),
          h("div", { class: "atk-grid" }, ["lp", "mp", "hp", "lk", "mk", "hk", "taunt"].map(atk)),
          h("p", { class: "combo-note" }, t("help.combos"))
        )
      );
    }
    tab_moves() {
      const slots = ROSTER.map((f) => h("button", { class: "slot small", title: f.name }, artEl(f, 0, "head")));
      const list = h("div", { class: "help-slots" }, GROUPS.map((g) => h(
        "div",
        { class: "help-group", style: { "--gc": g.color } },
        h("div", { class: "group-title" }, h("span", {}, t(`group.${g.id}`)), h("i")),
        h("div", { class: "slot-grid c3" }, slots.filter((_, i) => ROSTER[i].group === g.id))
      )));
      this.slotFocus = new FocusGroup(slots, {
        initial: this.fighter,
        silent: false,
        onFocus: (_, i) => {
          if (i !== this.fighter) {
            this.fighter = i;
            this.updateMoves();
          }
        }
      });
      this.moveBox = h("div", { class: "help-card moves" });
      queueMicrotask(() => this.updateMoves());
      return h("div", { class: "help-body moves-layout" }, list, this.moveBox);
    }
    updateMoves() {
      if (!this.moveBox) return;
      const def = ROSTER[this.fighter];
      const k = this.keys;
      this.moveBox.innerHTML = "";
      this.moveBox.append(
        h("div", { class: "move-head" }, artEl(def, 0, "head", "mh-portrait"), h("div", {}, h("div", { class: "mh-name" }, def.name), h("div", { class: "mh-sub" }, `${t(`group.${def.group}`)} \xB7 ${def.archetype.toUpperCase()}`))),
        h("div", { class: "legend" }, [["\u2192", t("help.forward")], [keyLabel(k.lp), t("btn.lp")], [keyLabel(k.mp), t("btn.mp")], [keyLabel(k.hp), t("btn.hp")], [keyLabel(k.lk), t("btn.lk")], [keyLabel(k.mk), t("btn.mk")], [keyLabel(k.hk), t("btn.hk")]].map(([c, l]) => h("span", {}, key(c, "face"), " ", l))),
        ...getMoveList(def).map((m) => {
          const btns = BUTTON_GROUPS[m.input].map((b) => key(keyLabel(k[b]), "face")).flatMap((x, i) => i ? [h("span", { class: "sep" }, "/"), x] : [x]);
          const seq = m.motion.flatMap((n, i) => i ? [h("span", { class: "sep" }, "\u203A"), key(ARROW[n], "arrow")] : [key(ARROW[n], "arrow")]);
          return h(
            "div",
            { class: "move-row" },
            h("div", { class: "move-name" }, t(`move.${m.id}`), m.cost ? h("span", { class: "tag" }, t("help.cost", { n: m.cost / 100 })) : null),
            h("div", { class: "move-seq" }, seq, h("span", { class: "sep" }, "\u203A"), btns)
          );
        })
      );
    }
    tab_keys() {
      const k = this.keys;
      const row = (label, code) => h("div", { class: "key-row" }, h("span", {}, label), key(keyLabel(code), "big"));
      return h(
        "div",
        { class: "help-body two" },
        h(
          "div",
          { class: "help-card" },
          h("h3", {}, `${t("help.keysTitle")} ${this.player + 1}`),
          row(t("help.jump"), k.up),
          row(t("help.crouch"), k.down),
          row("\u2190", k.left),
          row("\u2192", k.right),
          ...["lp", "mp", "hp", "lk", "mk", "hk", "taunt"].map((b) => row(t(`btn.${b}`), k[b]))
        ),
        h("div", { class: "help-card" }, h("h3", {}, t("help.menuKeys")), h("p", {}, t("help.menuKeysList")))
      );
    }
    back() {
      Sfx.play("back");
      this.ctx.go("menu", { focus: this.from });
    }
    onKey(code, e) {
      if (code === "Escape") return this.back();
      if (code === "Tab") {
        this.player = 1 - this.player;
        Sfx.play("move");
        return this.render();
      }
      if (code === "PageUp" || code === "PageDown") {
        this.tab = (this.tab + (code === "PageDown" ? 1 : TABS2.length - 1)) % TABS2.length;
        Sfx.play("move");
        return this.render();
      }
      if (this.tab === 1) {
        this.slotFocus?.handleKey(code);
        return;
      }
      if (code === "ArrowLeft" || code === "ArrowRight") {
        this.tab = (this.tab + (code === "ArrowRight" ? 1 : TABS2.length - 1)) % TABS2.length;
        Sfx.play("move");
        this.render();
      }
    }
  };

  // js/main.js
  Settings.load();
  I18n.setLang(Settings.get("language"));
  var stage = document.getElementById("stage");
  function fit() {
    const k = Math.min(innerWidth / GAME.width, innerHeight / GAME.height);
    stage.style.transform = `translate(${(innerWidth - GAME.width * k) / 2}px, ${(innerHeight - GAME.height * k) / 2}px) scale(${k})`;
  }
  addEventListener("resize", fit);
  fit();
  var ctx2 = { go: (name, params) => scenes.go(name, params) };
  var scenes = new SceneManager(document.getElementById("scene-root"), document.getElementById("fade"), ctx2);
  Object.entries({ menu: MenuScene, select: SelectScene, versusIntro: VersusIntroScene, fight: FightScene, options: OptionsScene, help: HelpScene }).forEach(([n, S]) => scenes.register(n, S));
  Input.init();
  Input.onKey = (code, e) => {
    scenes.onKey(code, e);
  };
  var last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1e3);
    last = now;
    scenes.update(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  scenes.go("menu");
  window.__game = { scenes, Settings, Sfx };
})();

</script>
